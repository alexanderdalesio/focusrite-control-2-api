name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private keys, QR payloads, or device serial numbers.
  - type: input
    id: method
    attributes:
      label: Communication method
      description: State whether the problem occurs with direct USB or Focusrite Control 2.
      placeholder: Direct USB
    validations:
      required: true
  - type: input
    id: fc2
    attributes:
      label: Focusrite Control 2 version, if used
      placeholder: 1.1081.0.0
  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: Scarlett 16i16 4th Gen, firmware 3.0.2778.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected result, actual result, and sanitized diagnostic output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
